name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- ★★★ ここから最終手段 ★★★ ---
      # flutterfire configure の代わりに、シークレットから直接ファイルを生成する
      - name: Generate firebase_options.dart
        run: |
          printf "%s" "${{ secrets.FIREBASE_OPTIONS_DART }}" > lib/firebase_options.dart
          cat lib/firebase_options.dart # Debug: Print generated file content
      # --- ★★★ ここまで ★★★ ---

      - name: Get dependencies # インデントを修正
        run: flutter pub get # インデントを修正

      - name: Build Web # インデントを修正
        run: flutter build web --release # インデントを修正

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          channelId: live
          projectId: chikusaiapp
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
