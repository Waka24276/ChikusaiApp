name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # ★★★ 修正点: キャッシュを有効にする ★★★

      # ★★★ ここから追加 ★★★
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      # ★★★ ここから追加 ★★★
      - name: Activate FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Generate Firebase Options # 認証方法をサービスアカウントに修正
        run: flutterfire configure --project=YOUR_PROJECT_ID --out=lib/firebase_options.dart --platforms=web --web-app-id=1:1003496022860:web:96e83803025595952f4139 --account=${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMAIL }}

      - name: Build Web
        run: |
          flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: YOUR_PROJECT_ID
