name: Build and Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter環境のセットアップ（バージョンを固定してビルドの安定性を確保）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: flutter pub get

      # 4. Webアプリのビルド
      - name: Build Flutter web
        run: flutter build web --release --base-href / --pwa-strategy=none --no-source-maps

      # 5. Firebase Hostingデプロイ前の事前確認
      - name: Verify Firebase deployment secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not configured."
            echo "GitHub repository settings > Secrets and variables > Actions で設定してください。"
            exit 1
          fi

      # 6. Firebase Hostingへのデプロイ
      # このアクションは、リポジトリのルートにある firebase.json を自動的に読み込みます
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' # 正しいシークレット名に修正
          channelId: live
          projectId: chikusaiapp
