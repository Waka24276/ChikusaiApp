name: Build and Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter環境のセットアップ（バージョンを固定してビルドの安定性を確保）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: flutter pub get

      # 4. Webアプリのビルド
      - name: Build Flutter web
        run: flutter build web --release

      # 5. Firebase Hostingへのデプロイ
      # このアクションは、リポジトリのルートにある firebase.json を自動的に読み込みます
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHIKUSAIAPP }}' # ★注意: あなたが設定したシークレット名にしてください
          channelId: live
          projectId: chikusaiapp
